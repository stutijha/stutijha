name: Update contribution activity graph

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: contribution-graph-main
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: stutijha
        run: node .github/scripts/activity-graph.mjs

      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          if git diff --cached --quiet; then
            echo "No graph changes to commit."
            exit 0
          fi
          git commit -m "update contribution activity graph"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
